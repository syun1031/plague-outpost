<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>暗疫陣地：指揮官推理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 開始畫面：作戰簡報檔案夾 -->
  <section id="start" class="screen">
    <div class="tape tape-start" aria-hidden="true"><span>隔離區　禁止進入　</span></div>
    <div class="folder">
      <div class="folder-tab">作戰簡報</div>
      <div class="folder-body">
        <div class="brief">
          <h1>暗疫陣地</h1>
          <p class="story">一種沒有病徵的病毒混進了陣地。感染者看起來和大家一樣，只有具備專長的隊員能看出端倪。你是這裡的指揮官：讀懂隊員的回報，找出每一個感染者，別傷到自己人。</p>
          <div class="stamp-mark" aria-hidden="true">機密</div>
        </div>

        <div class="pick-block">
          <h2>指揮官</h2>
          <div class="cmd-pick">
            <button class="cmd-opt selected" data-cmd="male">
              <div class="photo"><div class="cmd-art" data-art="male"></div><span class="clip"></span></div>
              <div class="file-lines"><strong>霍克 少校</strong><span>前線偵防出身，冷靜精準</span></div>
            </button>
            <button class="cmd-opt" data-cmd="female">
              <div class="photo"><div class="cmd-art" data-art="female"></div><span class="clip"></span></div>
              <div class="file-lines"><strong>薇拉 少校</strong><span>醫療部隊出身，果斷敏銳</span></div>
            </button>
          </div>
        </div>

        <div class="opts">
          <div class="opt-row">
            <h2>陣地大小</h2>
            <div class="seg" data-key="size">
              <button class="selected" data-v="4x4x3">4×4<small>3 名感染者</small></button>
              <button data-v="5x5x5">5×5<small>5 名感染者</small></button>
              <button data-v="6x6x7">6×6<small>7 名感染者</small></button>
            </div>
          </div>
          <div class="opt-row">
            <h2>難度</h2>
            <div class="seg" data-key="difficulty">
              <button data-v="easy">簡單<small>單一線索就能推出</small></button>
              <button class="selected" data-v="normal">普通<small>需要比對兩條線索</small></button>
              <button data-v="hard">困難<small>需要假設與排除</small></button>
            </div>
          </div>
          <div class="opt-row">
            <h2>模式</h2>
            <div class="seg" data-key="mode">
              <button class="selected" data-v="normal">一般<small>標記全對即勝利</small></button>
              <button data-v="hardcore">硬派<small>必須親手處決全部感染者</small></button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="btnStart" class="primary big">開始作戰</button>
          <button id="btnDaily" class="secondary big">今日任務<small id="dailyInfo"></small></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 遊戲畫面：野戰指揮桌 -->
  <section id="game" class="screen hidden">
    <header class="hud">
      <div class="tape tape-thin" aria-hidden="true"></div>
      <div class="hud-bar">
        <div class="brand">暗疫陣地<span id="missionTag" class="mission"></span></div>
        <div class="hud-btns">
          <button id="btnRules" class="ghost">規則</button>
          <button id="btnMute" class="ghost">音效開</button>
          <button id="btnNew" class="ghost">換一題</button>
          <button id="btnMenu" class="ghost">回到簡報</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="table">
        <div class="readouts">
          <div class="plate"><span>感染者總數</span><b id="stTotal">0</b></div>
          <div class="plate"><span>已標記感染</span><b id="stMarked">0</b></div>
          <div class="plate"><span>已處決</span><b id="stDead">0</b></div>
          <div class="plate"><span>作戰時間</span><b id="stTime">00:00</b></div>
        </div>
        <div id="boardWrap" class="map"><div id="board"></div></div>
        <div class="tools">
          <div class="stamps" role="radiogroup" aria-label="標記工具">
            <button class="tool selected" data-tool="infected"><span class="ico" data-mark="infected"></span>標記感染</button>
            <button class="tool" data-tool="healthy"><span class="ico" data-mark="healthy"></span>標記健康</button>
            <button class="tool" data-tool="erase"><span class="ico erase">✕</span>擦除</button>
          </div>
          <button id="btnExec" class="danger" disabled>處決已標記的感染者</button>
        </div>
        <p class="hint">點隊員看技能範圍，點「?」放標記，按右鍵可直接標記健康。</p>
      </section>

      <aside class="side">
        <div class="radio">
          <div class="radio-top"><span class="led-dot"></span><span id="cmdName" class="cmd-name"></span><span class="grille" aria-hidden="true"></span></div>
          <div class="radio-body">
            <div id="cmdPortrait" class="portrait"></div>
            <div id="cmdSay" class="say" aria-live="polite"></div>
          </div>
        </div>
        <div class="dossier">
          <span class="paperclip" aria-hidden="true"></span>
          <h3>人員檔案</h3>
          <ul id="legendList"></ul>
        </div>
      </aside>
    </main>
  </section>

  <canvas id="fx"></canvas>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-btns" id="modalBtns"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
